<template>
    <lightning-card title="Activity Feed" icon-name="custom:custom14">
        <div class="timeline">
            <template if:true={emailDataWithKeys}>
                <template for:each={emailDataWithKeys} for:item="emailData">
                    <template if:true={emailData.openCount}>
                        <div key={emailData.openKey} class="info">
                            <div class="slds-media activity-border">
                                <span class="slds-text-heading_small icon">
                                    <lightning-icon icon-name="utility:email_open" alternative-text="Open Email"></lightning-icon>
                                </span>
                                <div class="slds-media__body">
                                    <h3 class="titol">
                                        <p>Open Email</p>
                                    </h3>
                                    <p class="nom">{emailData.name}</p>
                                    <p>{emailData.openCount} times</p>
                                </div>
                                <div class="slds-media__figure slds-timeline__actions">
                                    <div class="slds-timeline__actions">
                                        <p class="slds-timeline__date">{emailData.openDate}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template if:true={emailData.clickCount}>
                        <div key={emailData.clickKey} class="info">
                            <div class="slds-media activity-border">
                                <span class="slds-text-heading_small icon">
                                    <lightning-icon icon-name="utility:touch_action" alternative-text="Click Email"></lightning-icon>
                                </span>
                                <div class="slds-media__body">
                                    <h3 class="titol">
                                        <p>Click Email</p>
                                    </h3>
                                    <p class="nom">{emailData.name}</p>
                                    <p>{emailData.clickCount} times</p>
                                </div>
                                <div class="slds-media__figure slds-timeline__actions">
                                    <div class="slds-timeline__actions">
                                        <p class="slds-timeline__date">{emailData.clicDate}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
